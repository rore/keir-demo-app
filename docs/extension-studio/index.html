<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task follow-up · Keir</title>
<style>
:root {
  font: 15px/1.55 "Segoe UI", Arial, sans-serif;
  color: #272629;
  --ink: #272629;
  --dim: #605d60;
  --berry: #702d39;
  --line: #d8d5d2;
  --sheet: #fffcf4;
  --desk: #d0d6d9;
  --inset: clamp(20px, 3vw, 54px);
}
* { box-sizing: border-box }
body,h1,h2,h3,p { margin: 0 }
button,select,input,textarea { font: inherit; color: inherit }
button,summary { cursor: pointer }
button { border: 1px solid #c5c1c0; background: white; border-radius: 5px; padding: 7px 12px; font-size: 14px }
button:hover:not(:disabled),summary:hover { background-color: #f0edeb }
button.primary { background: var(--berry); border-color: var(--berry); color: white; font-weight: 600 }
button.primary:hover:not(:disabled) { background: #51202b }
button:disabled { background: #ece9e5; color: #676064; border-color: #cfcbca; cursor: default }
button.primary:disabled { background: #ece9e5; border-color: #cfcbca; color: #676064 }
a,.link { color: var(--berry) }
.link,.quiet { border: 0; background: transparent }
:focus-visible { outline: 3px solid #16668b; outline-offset: 3px }
h1 { font-size: clamp(22px, 2.3vw, 34px); letter-spacing: -.04em; font-weight: 640; line-height: 1.2 }
h2 { font-size: clamp(22px, 2vw, 29px); line-height: 1.2; letter-spacing: -.035em; font-weight: 620 }
h3 { font-size: 16px; line-height: 1.4 }
small,.small,.muted,.help { color: var(--dim) }
small,.help { font-size: 13px }
.help { margin-top: 12px }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.workspace { display: flex; flex-direction: column; height: 100dvh; min-height: 480px }
.topbar { background: var(--ink); color: #fffcf4; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; min-height: 51px; gap: 12px }
.identity,.user-tools { display: flex; align-items: center; gap: 15px }
.brand { font-size: 23px; line-height: 1; font-weight: 720; letter-spacing: -.06em }
.brand::after { content: ""; display: inline-block; background: #eac46c; width: 6px; height: 6px; margin-left: 3px }
.studio-name { border-left: 1px solid #737175; padding-left: 15px; font-size: 14px }
.topbar select,.topbar button { color: #fffcf4; background: var(--ink); border: 1px solid #78757a; border-radius: 4px; font-size: 13px; padding: 4px 8px }
.topbar button:hover:not(:disabled) { background: #494449 }
.prototype { color: #e4dfdc; font-size: 12px }
.room { display: grid; grid-template-columns: minmax(0,var(--chat-width,55fr)) 16px minmax(0,var(--preview-width,45fr)); flex: 1; min-height: 0 }
.chat,.canvas { display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.chat { background: #fff }
.chathead { padding: 25px var(--inset) 18px; border-bottom: 1px solid var(--line) }
.chathead .status { margin-top: 6px; color: var(--dim); font-size: 14px }
.messages { min-height: 64px; flex: 1; overflow-y: auto; padding: 24px var(--inset) 10px; scrollbar-width: thin }
.message { overflow-wrap: anywhere; margin: 0 0 22px; max-width: 70ch; line-height: 1.65; font-size: 16px }
.who { display: block; font-size: 13px; font-weight: 650; color: var(--berry); margin-bottom: 4px }
.earlier { font-size: 13px; margin-bottom: 23px }
.earlier>summary { color: var(--dim); font-weight: 450 }
.earlier[open]>summary { margin-bottom: 20px }
.message.user { margin-left: auto; background: #f3f1ef; padding: 10px 15px; border-radius: 10px 10px 2px 10px; max-width: min(59ch,89%) }
.message.user .who { color: var(--dim) }
.message-text { white-space: pre-wrap }
.receipt { display: inline-block; margin-top: 7px; padding: 2px 0; border: none; border-bottom: 1px solid #ba9a9c; border-radius: 0; color: var(--berry); background: transparent; font-size: 13px }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px var(--inset) 10px }
.suggestions button { background: transparent; font-size: 13px }
.composer { display: flex; gap: 10px; align-items: end; margin: 0 var(--inset) 22px; border: 1px solid #aca5a6; border-radius: 7px; padding: 10px 11px }
.composer:focus-within { border-color: var(--berry); box-shadow: 0 0 0 1px var(--berry) }
.composer textarea { flex: 1; width: 0; resize: vertical; min-height: 42px; max-height: 120px; border: 0; outline: 0; padding: 4px; background: transparent }
.splitter { position: relative; cursor: col-resize; background: var(--desk); touch-action: none; user-select: none; border-left: 1px solid #b1b8bc }
.splitter:focus-visible { outline-offset: -3px }
.splitter::after { content: ""; position: absolute; top: calc(50% - 22px); left: 4px; width: 3px; height: 44px; border-inline: 1px solid #63656b }
.splitter:hover,.splitter:focus-visible,.dragging .splitter { background: #adb9bf }
.dragging { cursor: col-resize; user-select: none }
.canvas { background: var(--desk); padding: 0 clamp(15px,2.3vw,42px) 18px; overflow-y: auto; overflow-wrap: anywhere; scrollbar-width: thin }
.canvashead { display:flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; padding: 20px 0 14px }
.canvashead strong { font-size: 14px; color: #363c40 }
.canvas-tools { display: flex; align-items: center; gap: 12px }
.canvas-tools button { font-size: 12px; padding: 4px 8px; background: transparent; border-color: #a2a8aa }
.sheet { background: var(--sheet); border: 1px solid #bfc1ba; box-shadow: 1px 3px 0 #33333716; padding: clamp(19px,2.4vw,36px); margin: 0 auto; max-width: 760px }
.sheet-label { display: flex; align-items: center; gap: 9px; text-transform: uppercase; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: #544d43; margin-bottom: 13px }
.sheet-label::before { content: ""; width: 19px; height: 6px; background: #b78934 }
.sheet h2 { margin-bottom: 18px }
.example-list { list-style: none; padding: 0; margin: 21px 0 0; border-top: 2px solid var(--ink) }
.example-list li { display: flex; gap: 14px; align-items: start; padding: 17px 4px; border-bottom: 1px solid #cfc8bd }
.task-box { width: 19px; height: 19px; border: 1.5px solid #65615a; margin-top: 3px; flex: 0 0 auto; border-radius: 3px; text-align: center; font: 15px/18px Arial }
.task-box.done { background: #514f4c; color: white }
.example-list small { display: block; margin-bottom: 3px }
.example-list strong { font-size: 17px; font-weight: 620 }
.example-list .added { background: #f8edce; padding-inline: 12px; border-left: 3px solid #92681e }
.current-note { font-size: 14px; margin-top: 17px }
.choice-editor,.proposal-note { font-size: 13px; border-top: 1px solid #b8bebf; padding-top: 10px; margin: 14px auto 0; max-width: 760px }
summary { width: fit-content; padding: 4px 0; font-weight: 570 }
.proposal-note p { margin: 8px 0 }
.fields { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0 }
.fields label { flex: 1 1 155px }
.fields input,.fields select { display: block; width: 100%; margin: 4px 0; padding: 7px; background: white; border: 1px solid #ada7a0; border-radius: 4px }
.actions,.pending,.operation { display: flex; gap: 9px; align-items: center; flex-wrap: wrap }
.actions { margin-top: 15px }
.callout,.error,.pending,.operation { padding: 13px; border-left: 3px solid #997126; background: #f6ebcf; font-size: 14px; margin-bottom: 12px }
.operation { margin: 0 var(--inset) 8px }
.operation p,.pending span { flex: 1 }
.operation small { display:block }
.error { color: #7e2730; background: #fff1e9; border-color: #843b41 }
.callout.neutral,.pending { background: #edf1f2; border-color: #647784 }
.case,.event,.fact { border-top: 1px solid #d3cdc2; padding: 12px 0 }
.case summary { width: auto; font-size: 15px }
.case summary small { display: block; margin-left: 16px; font-weight: 400 }
.case p,.event { font-size: 14px }
.case.mismatch { border-left: 3px solid #9b762a; padding-left: 12px }
.fact { display: grid; grid-template-columns: 76px 1fr; gap: 10px; font-size: 14px }
.fact>span:first-child,.event strong { color: var(--dim) }
.review-actions { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line) }
.check { display: flex; align-items: baseline; gap: 9px; margin-top: 12px; font-size: 14px }
.check input { accent-color: var(--berry); flex-shrink: 0 }
.panel+.panel { margin-top: 18px }
.panel-title { font-weight: 620; margin-bottom: 8px }
.panel-title .badge { margin-left: 8px }
.badge { font-size: 13px; font-weight: 500 }
.event strong { display: block; font-size: 12px }
.mobile-jump { display: none }
@media(max-width:820px) {
  .workspace { height: auto; min-height: 100dvh }
  .room { display: block }
  .splitter { display: none }
  .chat { height: min(720px,85dvh); min-height: 460px }
  .canvas { overflow: visible; padding-bottom: 25px }
  .canvashead { padding-top: 17px }
  .mobile-jump { display: inline-block; font-size: 13px }
  .chathead .mobile-jump { margin-top: 5px }
  .topbar { padding: 8px 15px }
  .identity,.user-tools { gap: 8px }
  .studio-name { padding-left: 8px }
  .prototype { display: none }
  .chathead { padding-top: 18px; padding-bottom: 13px }
  .composer { margin-bottom: 12px }
}
</style>
</head>
<body>
<!-- INTERACTIVE DESIGN PROTOTYPE: scripted; no live agent or task effects. -->
<main class="workspace">
 <header class="topbar">
  <div class="identity"><span class="brand">keir</span><span class="studio-name">Extension Studio</span></div>
  <div class="user-tools"><span class="prototype">Sample workspace</span><button id="reset" title="Restore the sample conversation">Start over</button><label class="sr-only" for="user">Example user</label><select id="user"><option>Maya</option><option>Leo</option><option>Sam</option></select></div>
 </header>
 <div class="room" id="room">
  <section class="chat" id="chat" aria-labelledby="chat-title">
   <header class="chathead"><h1 id="chat-title">Task follow-up</h1><p class="status" id="versions"></p><a href="#canvas" class="mobile-jump">See example ↓</a></header>
   <div class="messages" id="messages" role="log" aria-label="Conversation"></div>
   <div id="operation" aria-live="polite"></div>
   <div class="suggestions" id="suggestions" aria-label="Suggested replies"></div>
   <form class="composer" id="composer"><label class="sr-only" for="message">Message about this change</label><textarea id="message" rows="2" placeholder="Tell Keir what you’d like to change…"></textarea><button class="primary" type="submit">Send</button></form>
  </section>
  <div class="splitter" id="splitter" role="separator" tabindex="0" aria-label="Conversation width" aria-orientation="vertical" aria-controls="chat canvas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55" title="Drag to resize, or use the left and right arrow keys"></div>
  <section class="canvas" id="canvas" aria-labelledby="canvas-label" tabindex="-1">
   <header class="canvashead"><strong id="canvas-label">Your preview</strong><div class="canvas-tools"><a href="#message" class="mobile-jump">Back to chat ↑</a><button id="attention">Keep this view</button></div></header>
   <div id="pending" aria-live="polite"></div>
   <div id="canvas-body"></div>
  </section>
 </div>
</main>
<script type="module">
import { workingState, talk, canvasAction, evidenceView, inspectEvidence, followConversation, holdCanvas, operationAction, restoreSession, draftKey } from './studio.mjs';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = 'keir-studio-business-v1';
let state = workingState(), storageWarning = '';
try { const saved = JSON.parse(sessionStorage.getItem(key)); if (saved?.users?.Maya?.evidence) state = restoreSession(saved); } catch { storageWarning = 'Tab storage is unavailable. Changes will last only while this page is open.'; }
let timer, scheduled = '', lastMessageCount = -1, lastUser = '', renderedCanvas = '';
const historyCut = new Map();
function save() { try { sessionStorage.setItem(key, JSON.stringify(state)); } catch { storageWarning = 'Tab storage is unavailable. Keep this page open to retain your work.'; } }
function apply(next, focusComposer = false) { state = next; save(); render(); if (focusComposer) $('message').focus(); }
function say(text) { if (!text.trim()) return; $('message').value = ''; apply(talk(state, text), true); }
function label(item) { const d = item.draft; return d.step === 'test' ? d.tested || d.mismatch ? 'Examples we tried' : 'Examples to try' : d.step === 'review' ? 'What will change' : d.step === 'activity' ? 'Your setup' : 'A task and its next step'; }
function receipt(item) { return `<button class="receipt" data-evidence="${item.id}" aria-label="Open saved preview: ${esc(label(item))}, ${esc(item.draft.title)}">View example ↗</button>`; }
function render() {
 const u = state.users[state.user], d = u.draft, a = u.active, op = u.operation;
 $('user').value = state.user;
 const same = a?.enabled && a.revision===d.revision && a.project===d.project && a.title===d.title;
 $('versions').textContent = same ? 'This setup is on in the sample workspace.' : a?.enabled ? 'Your current setup is on. These changes are still a draft.' : d.started ? 'Draft · You choose when to turn this on.' : 'Tell Keir how you’d like your tasks to work.';
 const messages = $('messages'), nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 45;
 const scrollConversation=(lastMessageCount!==u.messages.length||lastUser!==state.user)&&(nearBottom||lastUser!==state.user||lastMessageCount<0);
 if (lastMessageCount !== u.messages.length || lastUser !== state.user) {
  if (!historyCut.has(state.user)) {
    const latestQuestion = u.messages.findLastIndex(m => m.role === 'user');
    historyCut.set(state.user, u.messages.length > 6 ? Math.max(0, latestQuestion) : 0);
  }
  const cut = historyCut.get(state.user);
  const expanded = state.user === lastUser && messages.querySelector('.earlier')?.open;
  const turns = u.messages.map(m => {
    const saved = u.evidence?.find(item => item.id === m.evidenceId);
    return `<div class="message ${m.role}"><span class="who">${m.role==='assistant'?'Keir':esc(state.user)}</span><div class="message-text">${esc(m.text)}</div>${saved?receipt(saved):''}</div>`;
  });
  const earlier = cut ? `<details class="earlier" ${expanded?'open':''}><summary>Earlier messages (${cut})</summary>${turns.slice(0,cut).join('')}</details>` : '';
  messages.innerHTML = earlier + turns.slice(cut).join('');
  if (nearBottom || lastUser !== state.user || lastMessageCount < 0) messages.scrollTop = messages.scrollHeight;
  lastMessageCount = u.messages.length; lastUser = state.user;
 }
 const prompts = !d.started ? [d.request] : d.step==='activity' ? ['Change the task title','Try a completed task'] : d.approved ? ['Show me what will change'] : d.mismatch ? [`Only ${d.project}`,'Talk it through'] : d.tested ? ['Show me what will change','Change the task title'] : [`Only ${d.project}`,'Try a few examples'];
 $('suggestions').innerHTML = prompts.map(p => `<button data-prompt="${esc(p)}">${esc(p)}</button>`).join('');
 $('operation').innerHTML = op && ['running','paused','interrupted','superseded'].includes(op.status) ? `<div class="operation"><p>${op.status==='running'?'Trying three examples…':op.status==='superseded'?'Your choices changed · try the examples again':op.status==='interrupted'?'The check was interrupted':'Examples paused'}<small>${op.status==='running'?'Your tasks stay as they are. You can keep talking.':'Your changes and earlier examples are saved.'}</small></p>${op.status==='running'?'<button data-operation="pause">Pause</button>':op.status==='superseded'?'<button data-operation="start">Try again</button>':'<button data-operation="resume">Continue</button>'}</div>` : '';
 const runKey = op?.status==='running' ? `${state.user}:${op.id}` : '';
 if (scheduled !== runKey) { clearTimeout(timer); scheduled = runKey; if (runKey) { const id=op.id, owner=state.user; timer=setTimeout(() => { if(state.user===owner)apply(operationAction(state,{type:'finish',id,owner})); },4200); } }
 $('attention').textContent = u.held ? 'Follow chat' : 'Keep this view';
 $('attention').setAttribute('aria-pressed',String(Boolean(u.held)));
 $('pending').innerHTML = u.pendingEvidence ? `<div class="pending"><span>A new preview is ready. You’re still viewing the earlier one.</span><button id="show-latest">Show latest</button></div>` : '';
 renderCanvas();
 if(scrollConversation)messages.scrollTop=messages.scrollHeight;
}
function renderCanvas() {
 const u=state.users[state.user], item=evidenceView(state), current=u.draft;
 const d=item?.draft ?? current, a=item ? item.active : u.active;
 const viewKey=`${state.user}:${item?.id ?? 'empty'}`;
 // Keep unsubmitted form values and focus while new evidence is offered.
 if(u.held && renderedCanvas===viewKey)return;
 const changedView=renderedCanvas!==viewKey;
 renderedCanvas=viewKey;
 const historical=Boolean(item && (item.id!==u.evidence.at(-1).id || draftKey(d)!==draftKey(current)));
 const showingTask = d.started && ['behavior','describe'].includes(d.step);
 const heading = showingTask ? 'Your follow-up task' : item ? label(item) : 'Your first example';
 let html = `<div class="sheet"><p class="sheet-label">Sample · ${esc(d.project)}</p><h2>${esc(heading)}</h2>`;
 let editor = '';
 if(storageWarning)html+=`<div class="error" role="alert">${esc(storageWarning)}</div>`;
 if(current.error)html+=`<div class="error" role="alert">${esc(current.error)}</div>`;
 if(historical)html+=`<div class="callout neutral">You’re looking at an earlier example. Your latest changes are saved separately.<br><button class="link" id="return-current">Back to latest changes →</button></div>`;
 if(!d.started)html+=`<div class="panel empty"><h3>What would you like help with?</h3><p class="small muted">Tell me in the conversation. I’ll show a useful example here so you can see what would happen.</p></div>`;
 else if(d.step==='behavior'||d.step==='describe') {
  html += `<p>Here’s how your task list would look after you finish a task in <strong>${esc(d.project)}</strong>.</p>
    <ol class="example-list">
      <li><span class="task-box done" aria-hidden="true">✓</span><div><small>You finish</small><strong>Send the project update</strong></div></li>
      <li class="added"><span class="task-box" aria-hidden="true"></span><div><small>The app would add</small><strong>${esc(d.title)}</strong></div></li>
    </ol>
    <p class="current-note">${a?.enabled ? `Your current setup adds “${esc(a.title)}” in ${esc(a.project)}.` : 'You have no follow-up turned on.'} Other projects would stay as they are with this change.</p>`;
  if(!historical)editor=`<details class="choice-editor"><summary>Change the project or task name</summary><div class="fields"><label for="project">Project<select id="project"><option ${d.project==='Launch'?'selected':''}>Launch</option><option ${d.project==='Operations'?'selected':''}>Operations</option></select></label><label for="title">Follow-up task name<input id="title" maxlength="120" value="${esc(d.title)}"></label></div><div class="actions"><button id="apply-choices">Use these choices</button></div><p class="help">Your current setup stays as it is.</p></details>`;
 } else if(d.step==='test') {
  const ran=d.tested||d.mismatch;
  if(d.mismatch)html += `<div class="callout"><strong>What should happen outside ${esc(d.project)}?</strong><p>You asked for a follow-up there, but this change would leave the list as it is.</p></div>`;
  html += `<p>${d.mismatch?'Two examples worked as you wanted. One needs your decision.':d.tested?'All three examples worked as you wanted.':'Here’s what we’ll try with sample tasks.'}</p>`;
  const cases=[[`You finish a task in ${d.project}`,`Create “${d.title}”`,ran?'A follow-up is added':'Not run',false],['You finish a task in another project',d.expectation==='create'?'Create a task':'No change',ran?'No change':'Not run',d.mismatch],['The finished task no longer exists','Nothing is added',ran?'Nothing is added':'Not run',false]];
  html += cases.map(([name, expected, observed, mismatch]) => `<details class="case ${mismatch?'mismatch':''}" ${mismatch?'open':''}><summary>${esc(name)}<small>${ran ? esc(observed) : 'Ready to try'}</small></summary><p>You wanted: ${esc(expected)}.</p></details>`).join('');
  if(!historical && d.mismatch) html += `<div class="actions"><button id="correct-expectation">Keep it in ${esc(d.project)} only</button><button data-prompt="Explain the behavior">Talk it through</button></div>`;
  if(!historical&&d.tested)html+=`<button class="primary" data-prompt="Show me what will change">See what will change →</button>`;
 } else if(d.step==='review') {
  html += `<p>When <strong>${esc(state.user)}</strong> finishes a task in <strong>${esc(d.project)}</strong>, the app would add one follow-up called <strong>“${esc(d.title)}”</strong>.</p>
    <p class="current-note">${a?.enabled ? `Today it adds “${esc(a.title)}” in ${esc(a.project)}. ` : ''}Other projects stay as they are. If the original task is missing, nothing is added.</p>
    <p class="current-note">${d.tested?'All three examples did what you asked.':'Your examples need checking again.'}</p>`;
  if(!historical) html += `<div class="review-actions"><h3>${d.approved?'Your change is confirmed':'Confirm your change'}</h3>
    <label class="check"><input id="review-behavior" type="checkbox" ${d.approved?'checked disabled':''}>This is what I want for ${esc(state.user)} in ${esc(d.project)}.</label>
    <label class="check"><input id="review-scenarios" type="checkbox" ${d.approved?'checked disabled':''}>I checked the results using sample tasks.</label>
    <div class="actions"><button id="approve" ${d.approved?'disabled':''}>${d.approved?'Confirmed':'This is what I want'}</button><button id="activate" class="primary" ${!d.approved?'disabled':''}>Turn this on</button></div>
    <p class="help">Confirm first, then choose when to turn it on in this sample workspace.</p></div>`;
 } else if(d.step==='activity') {
  html+=`<div class="panel"><div class="panel-title"><span>Your follow-up</span><span class="badge ${a?.enabled?'active':''}">${a?.enabled?'On in this preview':'Off'}</span></div><div class="panel-body"><h3>${esc(a?.title ?? 'Nothing turned on')}</h3><p class="small muted">For ${esc(state.user)}, when a task is finished in ${esc(a?.project ?? d.project)}. Tasks already added stay in the list.</p></div></div><div class="panel"><div class="panel-title">Sample activity</div>${(item?.activity ?? u.activity).map(e=>`<div class="event"><strong>${esc(({activated:'Turned on',disabled:'Turned off',rollback:'Previous setup restored',example:'Example task',unknown:'Needs checking'})[e.kind] ?? e.kind)}</strong>${esc(e.text.split(" Technical status:")[0])}</div>`).join('')}</div>`;
  if(!historical)html+=`<div class="actions"><button data-prompt="Call the new task “Review the outcome”">Change the follow-up</button><button data-prompt="Try a completed task">Try an example</button><button data-prompt="Disable it">Turn off</button><button data-prompt="Roll back">Use previous setup</button></div>`;
 }
 html+=`</div>${editor}<details class="proposal-note"><summary>About this preview</summary><p>Saved example ${item?.id ?? "—"} · proposed version ${d.revision} · current version ${a?.revision ?? "—"}.</p><p>The preview follows our conversation. Keep a view open to take a closer look; new results wait until you’re ready.</p><p>This is a design prototype with fictional users and scripted replies, saved in this tab. It has no live AI or access to your tasks. <button class="link" id="provider">${state.provider?'Try an unavailable assistant':'Reconnect the example assistant'}</button></p></details>`;
 $('canvas-body').innerHTML=html;
 if(changedView)$('canvas').scrollTop=0;
}
$('composer').addEventListener('submit',e=>{e.preventDefault();say($('message').value);});
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();say($('message').value);}});
$('user').addEventListener('change',e=>{$('message').value='';apply(canvasAction(state,{type:'user',user:e.target.value}));});
$('reset').addEventListener('click',()=>{$('message').value='';historyCut.clear();lastMessageCount=-1;apply(workingState());});
$('attention').addEventListener('click',()=>apply(state.users[state.user].held?followConversation(state):holdCanvas(state)));
$('canvas-body').addEventListener('focusin',e=>{if(['project','title','review-behavior','review-scenarios'].includes(e.target.id)){state=holdCanvas(state);save();$('attention').textContent='Follow chat';$('attention').setAttribute('aria-pressed','true');}});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.prompt)say(b.dataset.prompt);
 if(b.dataset.evidence){apply(inspectEvidence(state,Number(b.dataset.evidence)));$('canvas').focus();}
 if(b.dataset.operation)apply(operationAction(state,{type:b.dataset.operation}));
 if(['show-latest','return-current'].includes(b.id))apply(followConversation(state));
 if(b.id==='apply-choices')apply(canvasAction(state,{type:'edit',project:$('project').value,title:$('title').value}));
 if(b.id==='correct-expectation')say(`Only ${state.users[state.user].draft.project}`);
 if(b.id==='approve'){apply(canvasAction(state,{type:'approve',behavior:$('review-behavior').checked,scenarios:$('review-scenarios').checked,evidenceId:evidenceView(state)?.id}));$('activate')?.focus();}
 if(b.id==='activate')apply(canvasAction(state,{type:'activate',evidenceId:evidenceView(state)?.id}));
 if(b.id==='provider')apply(canvasAction(state,{type:'provider'}));
});
const room = $('room'), splitter = $('splitter');
const splitKey = 'keir-studio-chat-width';
let preferredWidth = 55;
try {
  const saved = Number(sessionStorage.getItem(splitKey));
  if (saved > 0 && saved < 100) preferredWidth = saved;
} catch { /* Resizing still works in this tab. */ }

function resizePanes(requested = preferredWidth) {
  const width = room.clientWidth - splitter.offsetWidth;
  if (!splitter.offsetWidth || width <= 0) return;
  const min = Math.ceil(32000 / width);
  const max = Math.floor(100 - 32000 / width);
  const percent = Math.max(min, Math.min(max, Math.round(requested)));
  room.style.setProperty('--chat-width', percent + 'fr');
  room.style.setProperty('--preview-width', (100 - percent) + 'fr');
  splitter.setAttribute('aria-valuemin', min);
  splitter.setAttribute('aria-valuemax', max);
  splitter.setAttribute('aria-valuenow', percent);
  splitter.setAttribute('aria-valuetext', percent + '% conversation');
  return percent;
}

function rememberWidth() {
  try { sessionStorage.setItem(splitKey, String(preferredWidth)); } catch { /* Optional preference. */ }
}
let pointerOffset = 0;
splitter.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  pointerOffset = event.clientX - splitter.getBoundingClientRect().left;
  splitter.setPointerCapture(event.pointerId);
  splitter.focus();
  room.classList.add('dragging');
});
splitter.addEventListener('pointermove', event => {
  if (!splitter.hasPointerCapture(event.pointerId)) return;
  const x = event.clientX - room.getBoundingClientRect().left - pointerOffset;
  preferredWidth = resizePanes(100 * x / (room.clientWidth - splitter.offsetWidth)) ?? preferredWidth;
});
splitter.addEventListener('lostpointercapture', () => {
  room.classList.remove('dragging');
  rememberWidth();
});
splitter.addEventListener('keydown', event => {
  const current = Number(splitter.getAttribute('aria-valuenow'));
  const targets = { ArrowLeft: current - 5, ArrowRight: current + 5, Home: 0, End: 100 };
  if (!Object.hasOwn(targets, event.key)) return;
  event.preventDefault();
  preferredWidth = resizePanes(targets[event.key]) ?? preferredWidth;
  rememberWidth();
});
new ResizeObserver(() => resizePanes()).observe(room);
save();render();
</script>
